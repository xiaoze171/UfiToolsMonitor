<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>MU5120 电池</title>
<style>
:root{color-scheme:light;--text:#15171a;--muted:#7b818a;--line:#e8ebee;--soft:#f6f8f7;--green:#18ad67;--p:0%}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:max(24px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));background:#fff;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}main{width:min(820px,100%);margin:auto}header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 20px}.model{margin:0 0 5px;color:var(--muted);font-size:12px;letter-spacing:.08em}h1{margin:0;font-size:25px;line-height:1.1;letter-spacing:-.03em}.live{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}.offline .live:before{background:#e65966}.panel{overflow:hidden;border:1px solid var(--line);border-radius:24px}.hero{padding:24px;background:linear-gradient(135deg,#f2fbf6,#fafcfb)}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.soc{display:flex;align-items:flex-start;font-size:52px;font-weight:720;line-height:.9;letter-spacing:-.065em;font-variant-numeric:tabular-nums}.soc span{margin:4px 0 0 5px;color:var(--muted);font-size:18px;font-weight:600;letter-spacing:0}.hint{margin-top:9px;color:var(--muted);font-size:12px}.state{padding:7px 11px;border-radius:999px;background:#e5f7ed;color:#128b54;font-size:12px;font-weight:680}.battery-row{display:flex;align-items:center;margin-top:24px}.battery{flex:1;height:28px;padding:3px;border:2px solid #cfd5d1;border-radius:8px}.cap{width:5px;height:12px;border-radius:0 3px 3px 0;background:#cfd5d1}.fill{width:var(--p);height:100%;border-radius:4px;background:var(--green);transition:width .4s}.metrics{display:grid;grid-template-columns:repeat(2,1fr)}.metric{padding:18px 20px;border-top:1px solid var(--line)}.metric:nth-child(odd){border-right:1px solid var(--line)}.label{margin-bottom:7px;color:var(--muted);font-size:12px}.value{font-size:23px;font-weight:680;line-height:1;font-variant-numeric:tabular-nums}.value small{margin-left:3px;color:var(--muted);font-size:12px;font-weight:550}footer{display:flex;justify-content:space-between;gap:12px;margin:14px 3px 0;color:var(--muted);font-size:11px}#error{display:none;color:#d84d5c}.offline #error{display:inline}@media(min-width:700px){body{padding-top:48px}.panel{display:grid;grid-template-columns:1.08fr .92fr}.hero{padding:34px}.soc{font-size:62px}.metrics{align-content:stretch}.metric{display:flex;flex-direction:column;justify-content:center;padding:25px 24px}.metric:nth-child(-n+2){border-top:0}.value{font-size:25px}}@media(max-width:350px){body{padding-left:10px;padding-right:10px}.hero{padding:20px}.soc{font-size:46px}.metric{padding:16px}.value{font-size:21px}footer{flex-direction:column;gap:3px}}@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main id="app" aria-live="polite">
<header><div><p class="model">MU5120 · 软件电量计</p><h1>电池状态</h1></div><div class="live" id="live">连接中</div></header>
<section class="panel">
<div class="hero">
<div class="hero-top"><div><div class="soc"><b id="soc">--</b><span>%</span></div><div class="hint">软件估算电量</div></div><div class="state" id="status">读取中</div></div>
<div class="battery-row" id="battery" role="img" aria-label="软件估算电量"><div class="battery"><div class="fill"></div></div><div class="cap"></div></div>
</div>
<div class="metrics" aria-label="电池详细数据">
<div class="metric"><div class="label">电压</div><div class="value"><b id="voltage">--</b><small>V</small></div></div>
<div class="metric"><div class="label">电流</div><div class="value"><b id="current">--</b><small>mA</small></div></div>
<div class="metric"><div class="label">功率</div><div class="value"><b id="power">--</b><small>W</small></div></div>
<div class="metric"><div class="label">温度</div><div class="value"><b id="temp">--</b><small>℃</small></div></div>
<div class="metric"><div class="label">供电状态</div><div class="value"><b id="pmode">--</b></div></div>
<div class="metric"><div class="label">已插电</div><div class="value"><b id="plug">--</b><small>分钟</small></div></div>
</div></section>
<footer><span id="error">连接中断，正在重试</span></footer>
</main>
<script>
const app=document.getElementById('app'),battery=document.getElementById('battery'),live=document.getElementById('live'),ids=['soc','status','voltage','current','power','temp','pmode','plug'],el=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)])),fmt=(v,d=0)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'--';async function refresh(){try{const r=await fetch(`state.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw 0;const x=await r.json(),s=Math.max(0,Math.min(100,Number(x.soc)||0));el.soc.textContent=fmt(s,2);el.status.textContent=x.status_cn||x.status||'未知';el.voltage.textContent=fmt(Number(x.voltage_mv)/1000,3);el.current.textContent=fmt(x.current_ma);el.power.textContent=fmt(x.power_w,4);el.temp.textContent=fmt(x.temp_c,1);el.pmode.textContent=x.power_mode_cn||'--';el.plug.textContent=fmt(x.plugged_min);app.style.setProperty('--p',`${s}%`);battery.setAttribute('aria-label',`软件估算电量 ${fmt(s,2)}%`);live.textContent='实时';app.classList.remove('offline')}catch(e){live.textContent='离线';app.classList.add('offline')}}refresh();setInterval(refresh,1000);
</script>
</body>
</html>
